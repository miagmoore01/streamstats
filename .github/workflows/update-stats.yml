name: Update stream stats

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate stat image
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: python scripts/generate_stat.py

      - name: Commit and push if changed
        run: |
          git config user.name "stream-stats-bot"
          git config user.email "actions@github.com"
          git add docs/hours.png
          git diff --staged --quiet && echo "No changes" || (git commit -m "Update hours stat" && git push)
